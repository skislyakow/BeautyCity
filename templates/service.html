{% extends 'base.html' %}
{% load static %}

{% block title %}Выбор услуги — Beauty City{% endblock %}

{% block content %}
<style>
	.time__btns_next.active {
		background-color: #FFC107 !important;
		color: #fff !important;
		cursor: pointer !important;
		opacity: 1 !important;
	}
</style>

<section id="service">
    <div class="container">
        <div class="service">
            <div class="breadCrumbs">
                <a href="{% url 'index' %}" class="breadCrumbs__item">На главную</a>
            </div>
            <div class="service__block">
                <h1 class="service__title">Запись на услугу</h1>
                <button class="service__btn btn">Запись по телефону</button>
            </div>
            <form action="#" class="service__form" onsubmit="return false;">
                <div class="service__form_block service__salons">
                    <button type="button" class="accordion" id="salonAccordionBtn">(Выберите салон)</button>
                    <div class="panel">
                        <div id="salonsList">
                            <p class="js-loading">Загрузка салонов...</p>
                        </div>
                    </div>
                </div>
                <div class="service__form_block service__services">
                    <button type="button" class="accordion" id="procedureAccordionBtn" disabled>(Сначала выберите салон)</button>
                    <div class="panel">
                        <div id="proceduresList"></div>
                    </div>
                </div>
                <div class="service__form_block service__masters">
                    <button type="button" class="accordion" id="specialistAccordionBtn" disabled>(Сначала выберите услугу)</button>
                    <div class="panel">
                        <div id="specialistsList"></div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</section>
<section id="time">
    <div class="container">
        <div class="time">
            <h2 class="time__title">Выберите время</h2>
            <div class="time__block">
                <div class="row">
                    <div class="col-md-4">
                        <div id="datepickerHere"></div>
                    </div>
                    <div class="col-md-8">
                        <div class="time__elems" id="timeSlotsContainer">
                            <p class="js-loading">Сначала выберите салон, услугу и мастера</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="time__btns">
                <div class="row">
                    <div class="col-md-12">
                        <button type="button" id="nextBtn" class="time__btns_next" disabled>Далее</button>
                        <a href="{% url 'index' %}"><button type="button" class="time__btns_home">На главную</button></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/service_booking.js' %}"></script>
{% endblock %}
