{% load static %}
<div style="display: none;">
<div class="tipsPopup popup box-modal" id="tipsModal">
	<div class="box-modal_close arcticmodal-close"><img src="{% static 'img/x.svg' %}" alt="x"></div>
		<div class="popup__title tipsPopup__title">Чаевые</div>
		<form action="#" class="tipsPopup__form" data-url="{% url 'api_create_tip' %}">
			{% csrf_token %}
			<input type="hidden" name="booking_id" class="tipsPopup__booking" value="">
			<div class="tipsPopup__form_intro popup__intro">Введите сумму чаевых</div>
			<input type="text" name="amount" class="tipsPopup__form_input popup__input" placeholder="0.00" required>
			<div class="tipsPopup__error authPopup__error" style="display:none;"></div>
			<button type="submit" class="tipsPopup__btn popup__btn">Отправить</button>
		</form>
	</div>
</div>
