[project]
name = "beautycity"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6,<7",
    "djangorestframework>=3.15",
    "gunicorn>=22.0",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "reportlab>=4.0",
    "requests>=2.31",
    "yookassa>=3.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "beauty_city"]

[tool.ruff.format]
quote-style = "double"
